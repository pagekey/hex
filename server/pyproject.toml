[project]
name = "hex-server"
version = "1.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.141.1", "uvicorn>=0.53.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hex"]
artifacts = ["src/hex/static/**/*"]

[tool.hatch.build.targets.sdist]
include = ["src/hex", "tests"]
artifacts = ["src/hex/static/**/*"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]

[tool.pytest.ini_options]
addopts = ["--cov=hex", "--cov-report=term-missing"]
