name: Release Dry Run

on:
    push:
        branches-ignore: [main]

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                fetch-depth: 0
            - run: npx semantic-release --dry-run
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
